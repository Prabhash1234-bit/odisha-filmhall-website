<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FilmHall Odisha Admin</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b1a;--mute:#6b6862;--line:#dcd9d2;--accent:#0f5c4d;--danger:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1e;--ink:#f1efea;--mute:#a09c94;--line:#3a3835;--accent:#4fb59f;--danger:#f2958d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:820px;margin:0 auto}
.bar img{height:36px}
.bar h1{font-size:18px;margin:0;flex:1}
.tabs{display:flex;gap:6px;max-width:820px;margin:10px auto 0;overflow-x:auto}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px}
.muted{color:var(--mute);font-size:14px;margin:0 0 8px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
input[type=text],input[type=url],input[type=password],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:96px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.gal{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.gal .thumb{width:64px;height:48px}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:20}
#toast.err{background:var(--danger);color:#fff}
</style>
<script src="config.js?v=20261030a"></script>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="admin.js?v=20261030a"></script>
</body>
</html>
