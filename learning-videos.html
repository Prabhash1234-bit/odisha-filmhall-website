<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Videos - FilmHall Odisha</title>
<link rel="stylesheet" href="style.css?v=20261014a">
<style>
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin:20px 0; }
  .title { color:#C21E56; font-size:clamp(22px,4vw,32px); margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
  .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); text-decoration:none; color:inherit; }
  .thumb { width:100%; height:190px; object-fit:cover; }
  .body { padding:12px 14px; }
  .t { font-weight:700; }
  .d { font-size:13px; color:#666; margin-top:2px; }
  .action { display:inline-block; margin-top:8px; color:#C21E56; font-weight:700; }
  .empty { text-align:center; color:#666; padding:40px; }
  footer { margin-top:60px; padding:24px 16px; text-align:center; background:#fff; border-top:1px solid #eee; color:#666; }
</style>
</head>
<body class="inner-page">
<header class="inner-header">
  <a href="community-dashboard.html"><img src="logo.png" class="logo" alt="FilmHall"></a>
  <a class="back-link" href="community-dashboard.html">&#8592; Back to Community</a>
</header>
<main class="wrap">
  <div class="head"><h1 class="title">Learning Videos</h1></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No videos added yet.</div>
</main>
<footer><p id="footer-text">© 2026 FilmHall — An Unique Distribution System | All Rights Reserved</p></footer>
<script>
function getId(url){
  if(!url) return '';
  if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
    if(u.searchParams.get('v')) return u.searchParams.get('v');
    if(u.pathname.includes('/shorts/')) return u.pathname.split('/shorts/')[1].split('/')[0];
    if(u.pathname.includes('/embed/')) return u.pathname.split('/embed/')[1].split('/')[0];
  }catch(e){}
  return url;
}
async function load(){
  try{
    const res = await fetch('community-config.json?_='+Date.now());
    const cfg = await res.json();
    const list = (cfg.learningVideos||[]).filter(v=>v.published!==false);
    const grid=document.getElementById('grid'), empty=document.getElementById('empty');
    if(list.length===0){ empty.style.display='block'; return; }
    for(const v of list){
      const id=getId(v.url||v.id||'');
      const thumb=v.thumb||(id?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:'');
      const a=document.createElement('a');
      a.className='card';
      a.href = v.url && v.url.includes('youtube') ? v.url : `https://www.youtube.com/watch?v=${id}`;
      a.target='_blank';
      a.innerHTML=`<img class="thumb" src="${thumb}" alt=""><div class="body"><div class="t">${v.title||'Watch Video'}</div>${v.description?'<div class="d">'+v.description+'</div>':''}<span class="action">Watch Video →</span></div>`;
      grid.appendChild(a);
    }
    if(cfg.footerText) document.getElementById('footer-text').textContent=cfg.footerText;
  }catch(e){}
}
load();
</script>
</body>
</html>
