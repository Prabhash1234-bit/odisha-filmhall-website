<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Gallery - FilmHall Odisha</title>
<link rel="stylesheet" href="style.css?v=20261014a">
<style>
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin:20px 0; }
  .title { color:#C21E56; font-size:clamp(22px,4vw,32px); margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  .card img { width:100%; height:220px; object-fit:cover; }
  .body { padding:12px 14px; }
  .t { font-weight:700; }
  .d { font-size:13px; color:#666; margin-top:2px; }
  .empty { text-align:center; color:#666; padding:40px; }
  footer { margin-top:60px; padding:24px 16px; text-align:center; background:#fff; border-top:1px solid #eee; color:#666; }
</style>
</head>
<body class="inner-page">
<header class="inner-header">
  <a href="community-dashboard.html"><img src="logo.png" class="logo" alt="FilmHall"></a>
  <a class="back-link" href="community-dashboard.html">&#8592; Back to Community</a>
</header>
<main class="wrap">
  <div class="head"><h1 class="title">Latest Gallery</h1></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No photos added yet.</div>
</main>
<footer><p id="footer-text">© 2026 FilmHall — An Unique Distribution System | All Rights Reserved</p></footer>
<script>
async function load(){
  try{
    const res = await fetch('community-config.json?_='+Date.now());
    const cfg = await res.json();
    const list = (cfg.gallery||[]).filter(g=>g.published!==false);
    const grid=document.getElementById('grid'), empty=document.getElementById('empty');
    if(list.length===0){ empty.style.display='block'; return; }
    for(const g of list){
      const c=document.createElement('div');
      c.className='card';
      c.innerHTML=`<img src="${g.image||''}" alt=""><div class="body"><div class="t">${g.title||''}</div>${g.description?'<div class="d">'+g.description+'</div>':''}</div>`;
      grid.appendChild(c);
    }
    if(cfg.footerText) document.getElementById('footer-text').textContent=cfg.footerText;
  }catch(e){}
}
load();
</script>
</body>
</html>
